<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>Reservasi Hotel Room</title>
    </head>
    <body>
        <h1 style="text-align: left;">Reservasi Hotel Room</h1>
        <form action="" method="post">
            <fieldset>
                <legend>Personal Data</legend>
                <p>1. <label for="name">Name</label></p>
                <input type="text" id="name" name="name" size="40"/>
                <p>2. <label for="gender">Gender</label></p>
                <input type="text" id="gender" name="gender" size="40"/>
                <p>3. <label for="email">Email Address</label></p>
                <input type="text" id="email" name="email" size="40"/>
                <p>4. <label for="phone">Telp Number</label><br/></p>
                <input type="text" id="phone" name="phone" size="40"/>
            </fieldset>
            <p>Reservation Room Form</p>
            <p>1. <label for="reservname">Reservation Name</label></p>
                <input type="text" id="reservname" name="reservname" size="40"/>
            <p>2. <label for="bookdate">Booking Date</label></p>
                <input type="text" id="bookdate" name="bookdate" size="40"/>
            <p>3. <label for="roomtype">Room Type</label></p>
                <select id="roomtype" name="roomtype">
                    <option value="deluxe" selected="selected">Deluxe</option>
                    <option value="standard">Standard</option>
                </select>
            <p>4. <label for="bedtype">Bed Type</label></p>
                <select id="bedtype" name="bedtype">
                    <option value="single" selected="selected">Single Bed</option>
                    <option value="double">Double Bed</option>
                </select>
            <p>5. <label for="breakfast">Breakfast</label><br/></p>
                <label for="breakfast1"><input type="radio" id="breakfast1" name="breakfast" value="With Breakfast" selected="selected"/>With Breakfast</label>
                <label for="breakfast2"><input type="radio" id="breakfast2" name="breakfast" value="Without Breakfast"/>Without Breakfast</label>
            <fieldset>
                <legend>Payment</legend>
                <p>1. <label for="checkin">Check-in Date</label></p>
                <input type="text" id="checkin" name="checkin" size="40"/>
                <p>2. <label for="checkout">Check-out Date</label></p>
                <input type="text" id="checkout" name="checkout" size="40"/>
                <p>3. <label for="paymethod">Payment Method</label></p>
                <select id="paymethod" name="paymethod">
                    <option value="cash" selected="selected">Cash</option>
                    <option value="credit">Credit</option>
                </select>
            </fieldset>
            <input type="submit" id="simpan" name="simpan" value="Simpan"/>
        </form>
        </body>
</html>
